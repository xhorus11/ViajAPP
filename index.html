<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0a1628">
  <!-- Tema Día/Noche antes de pintar (evita el parpadeo) -->
  <script>try { var v = localStorage.getItem('viajapp-theme') || 'auto'; document.documentElement.dataset.theme = v === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day') : v; } catch (e) {}</script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Viajapp">
  <title>Viajapp · Organizador de viajes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Fondo (degradado fijo según el tema) -->
  <div class="bg" aria-hidden="true">
  </div>

  <main id="view" class="view"></main>

  <!-- Navegación inferior -->
  <nav class="tabbar" id="tabbar">
    <span class="tab-indicator" id="tabIndicator"></span>
    <button class="tab" data-tab="home" aria-label="Inicio">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span>
    </button>
    <button class="tab" data-tab="shop" aria-label="Supermercado">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.4"/><circle cx="17" cy="20.5" r="1.4"/></svg><span>Súper</span>
      <b class="tab-badge" id="shopBadge" hidden></b>
    </button>
    <button class="tab" data-tab="recipes" aria-label="Recetas">
      <svg viewBox="0 0 24 24"><path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2 11h20M9 7.5c0-1.2 1.2-1.6 0-3.5M13 7.5c0-1.2 1.2-1.6 0-3.5M17 7.5c0-1.2 1.2-1.6 0-3.5"/></svg><span>Recetas</span>
    </button>
    <button class="tab" data-tab="money" aria-label="Dinero">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10h19"/><circle cx="16.5" cy="14.5" r="1.6"/></svg><span>Dinero</span>
    </button>
    <button class="tab" data-tab="agenda" aria-label="Agenda">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="8.5" cy="15" r="1.2"/><circle cx="13" cy="15" r="1.2"/></svg><span>Agenda</span>
    </button>
  </nav>

  <!-- Hoja inferior (modales) -->
  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <div class="toasts" id="toasts"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="exportStage" aria-hidden="true"></div>
  <input type="file" id="importFile" accept="application/json" hidden>

  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/diets.js"></script>
  <script src="js/store.js"></script>
  <script src="js/export.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/group.js"></script>
  <script src="js/boletas.js"></script>
  <script src="js/cuentas.js"></script>
  <script src="js/trips.js"></script>
  <script src="js/clima.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
